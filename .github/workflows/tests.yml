name: Python portability

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e . ruff
      - name: Stage pinned JobBench judge for native lock tests
        run: python -c "from harness2 import install; install.clone('job-bench-eval'); install.patch('job-bench-eval')"
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/ui_story.test.cjs
      - run: python scripts/check_provenance.py
      - run: ruff check harness2 tests scripts
      - run: harness2-demo --output runs/demo --k 2
